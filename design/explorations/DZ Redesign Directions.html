<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DZ — Redesign Directions</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=Spectral:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Instrument+Serif:ital@0;1&family=Hanken+Grotesk:wght@400;500;600;700;800&family=Mulish:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  html, body { margin: 0; height: 100%; background: #ECE8E0; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="design-canvas.jsx"></script>
<script src="theme-data.js"></script>
<script src="icons.js"></script>
<script type="text/babel" src="redesign-screens.jsx"></script>
<script type="text/babel">
  const { DesignCanvas, DCSection, DCArtboard } = window;
  const { Foundations, Home, Detail, Reading } = window.DZScreens2;
  const D = window.DZDIR;
  const dirs = [D.ink, D.quiet, D.atelier];

  function App() {
    return (
      <DesignCanvas>
        {dirs.map((t) => (
          <DCSection key={t.key} id={t.key} title={t.name} subtitle={t.tagline}>
            <DCArtboard id={t.key + '-found'} label="Foundations" width={560} height={520}><Foundations t={t} /></DCArtboard>
            <DCArtboard id={t.key + '-home'} label="Home · Light" width={340} height={880}><Home t={t} mode="L" /></DCArtboard>
            <DCArtboard id={t.key + '-detail'} label="Book detail · Light" width={340} height={850}><Detail t={t} mode="L" /></DCArtboard>
            <DCArtboard id={t.key + '-read'} label="Reading · Dark" width={340} height={720}><Reading t={t} mode="D" /></DCArtboard>
          </DCSection>
        ))}
      </DesignCanvas>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
